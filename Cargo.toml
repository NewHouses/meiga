[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
repository = "https://github.com/NewHouses/meiga"
publish = false

[workspace.dependencies]
# The terminal core: parser, grid and terminal logic (ADR 0003). Pinned, because
# its API is 0.x, and without serde, which meiga does not use.
alacritty_terminal = { version = "=0.26.0", default-features = false }
meiga-core = { path = "crates/meiga-core" }
meiga-render = { path = "crates/meiga-render" }
meiga-win = { path = "crates/meiga-win" }
memchr = "2.8.3"
unicode-width = { version = "0.2.3", default-features = false }
windows = "0.62.2"
windows-core = "0.100.0"
windows-sys = "0.61.2"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

# Release build with debug information, for profiling with WPR/WPA.
[profile.profiling]
inherits = "release"
debug = "limited"
