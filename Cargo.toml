[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
repository = "https://github.com/NewHouses/meiga"
publish = false

[workspace.dependencies]
meiga-core = { path = "crates/meiga-core" }
meiga-render = { path = "crates/meiga-render" }
meiga-win = { path = "crates/meiga-win" }
windows-sys = "0.61.2"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

# Release build with debug information, for profiling with WPR/WPA.
[profile.profiling]
inherits = "release"
debug = "limited"
